<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
body {
  margin: 0;
  background: black;
  overflow: hidden;
}

/* Video fills screen */
video {
  width: 100%;
  height: 100vh;
  object-fit: contain;
  background: white;
}

/* Hide all default controls (extra safety) */
video::-webkit-media-controls {
  display: none !important;
}
</style>
</head>

<body>

 <video id="video" playsinline>
  <source src="MyVideo.mp4" type="video/mp4">
</video> 

<script>
const video = document.getElementById("video");
let started = false;

// Tap anywhere
document.body.addEventListener("click", () => {

  // First tap → play + fullscreen
  if (!started) {
    video.play().catch(()=>{});
    started = true;

    if (video.requestFullscreen) {
      video.requestFullscreen();
    }
  } 
  // Next taps → toggle play/pause
  else {
    if (video.paused) {
      video.play().catch(()=>{});
    } else {
      video.pause();
    }
  }

});
</script>

</body>
</html>
