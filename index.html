<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<style>
body {
  margin: 0;
  background: black;
  overflow: hidden;
}

video {
  width: 100%;
  height: 100vh;
  object-fit: contain;
}

#overlay {
  position: absolute;
  bottom: 30px;
  width: 100%;
  text-align: center;
  color: white;
  font-size: 16px;
  opacity: 0.8;
}
</style>
</head>

<body>

<video id="video" playsinline>
  <source src="MyVideo.mp4" type="video/mp4">
</video>

<div id="overlay"></div>

<script>
const video = document.getElementById("video");

document.body.addEventListener("click", () => {
  if (video.paused) {
    video.play();
    
    if (video.requestFullscreen) {
      video.requestFullscreen();
    }
  } else {
    video.pause();
  }
});
</script>

</body>
</html>
